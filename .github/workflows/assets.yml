name: Generate profile assets

on:
  schedule:
    # execute every day at 05:00 UTC
    - cron: "0 5 * * *"
  workflow_dispatch:
  push:
    branches: main
    paths:
      - scripts/generate_assets.py

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: generate svg assets
        run: python3 scripts/generate_assets.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || git commit -m "🤖 Update profile assets"
          git push
